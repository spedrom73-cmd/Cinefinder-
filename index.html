      zip.file("app/src/main/java/com/cinefinder/app/processing/ImageHasher.kt", `package com.cinefinder.app.processing

import android.graphics.Bitmap
import android.graphics.Color

object ImageHasher {
    fun computeDHash(bitmap: Bitmap): Long {
        val scaled = Bitmap.createScaledBitmap(bitmap, 9, 8, true)
        var hash = 0L
        for (y in 0 until 8) {
            for (x in 0 until 8) {
                val leftPixel = scaled.getPixel(x, y)
                val rightPixel = scaled.getPixel(x + 1, y)
                val leftBrightness = getLuminance(leftPixel)
                val rightBrightness = getLuminance(rightPixel)
                if (leftBrightness > rightBrightness) {
                    hash = hash or (1L shl (y * 8 + x))
                }
            }
        }
        return hash
    }

    private fun getLuminance(pixel: Int): Int {
        val r = Color.red(pixel)
        val g = Color.green(pixel)
        val b = Color.blue(pixel)
        return (0.299 * r + 0.587 * g + 0.114 * b).toInt()
    }

    fun calculateSimilarity(hash1: Long, hash2: Long): Double {
        val xor = hash1 xor hash2
        val hammingDistance = java.lang.Long.bitCount(xor)
        return ((64.0 - hammingDistance) / 64.0 * 100.0).coerceIn(0.0, 100.0)
    }
}`);

import android.content.Context
import android.graphics.Bitmap
import com.cinefinder.app.processing.ImageHasher
import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.withContext
import java.io.File
import java.io.FileOutputStream
import java.util.UUID

class ReferenceRepository(private val context: Context) {
    private val indexFile = File(context.filesDir, "references_index.txt")

    suspend fun getReferences(): List<ReferenceMovie> = withContext(Dispatchers.IO) {
        if (!indexFile.exists()) return@withContext emptyList()
        val list = mutableListOf<ReferenceMovie>()
        indexFile.readLines().forEach { line ->
            val parts = line.split("|")
            if (parts.size >= 4) {
                list.add(
                    ReferenceMovie(
                        id = parts[0],
                        title = parts[1],
                        hash = parts[2].toLongOrNull() ?: 0L,
                        imagePath = parts[3]
                    )
                )
            }
        }
        list
    }

    suspend fun addReference(title: String, bitmap: Bitmap): ReferenceMovie = withContext(Dispatchers.IO) {
        val id = UUID.randomUUID().toString()
        val hash = ImageHasher.computeDHash(bitmap)
        val file = File(context.filesDir, "ref_$id.jpg")
        FileOutputStream(file).use { out ->
            bitmap.compress(Bitmap.CompressFormat.JPEG, 85, out)
        }
        val item = ReferenceMovie(id, title, hash, file.absolutePath)
        indexFile.appendText("\${item.id}|\${item.title}|\${item.hash}|\${item.imagePath}\\n")
        item
    }

    suspend fun removeReference(id: String) = withContext(Dispatchers.IO) {
        val current = getReferences()
        val remaining = current.filter { it.id != id }
        val toDelete = current.find { it.id == id }
        toDelete?.let { File(it.imagePath).delete() }
        indexFile.writeText("")
        remaining.forEach { item ->
            indexFile.appendText("\${item.id}|\${item.title}|\${item.hash}|\${item.imagePath}\\n")
        }
    }
}`);

import android.content.Context
import android.media.MediaMetadataRetriever
import android.net.Uri
import com.cinefinder.app.model.MatchResult
import com.cinefinder.app.model.ReferenceMovie
import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.withContext

object VideoAnalyzer {
    suspend fun analyzeVideo(
        context: Context,
        videoUri: Uri,
        references: List<ReferenceMovie>,
        onProgress: (Float, String) -> Unit
    ): List<MatchResult> = withContext(Dispatchers.IO) {
        val retriever = MediaMetadataRetriever()
        try {
            context.contentResolver.openFileDescriptor(videoUri, "r")?.use { pfd ->
                retriever.setDataSource(pfd.fileDescriptor)
            } ?: throw IllegalStateException("Não foi possível aceder ao vídeo.")

            val durationMs = retriever.extractMetadata(
                MediaMetadataRetriever.METADATA_KEY_DURATION
            )?.toLongOrNull() ?: 0L

            if (durationMs <= 0L) throw IllegalStateException("Duração inválida ou formato incompatível.")

            val samplePoints = 10
            val interval = durationMs * 1000L / (samplePoints + 1)
            val extractedHashes = mutableListOf<Long>()

            for (i in 1..samplePoints) {
                val timeUs = i * interval
                val frameBitmap = retriever.getFrameAtTime(timeUs, MediaMetadataRetriever.OPTION_CLOSEST_SYNC)
                if (frameBitmap != null) {
                    extractedHashes.add(ImageHasher.computeDHash(frameBitmap))
                }
                onProgress((i.toFloat() / samplePoints.toFloat()) * 0.7f, "A analisar fotograma $i de $samplePoints...")
            }

            onProgress(0.85f, "A comparar fotogramas com referências...")
            val results = references.map { ref ->
                val bestScore = extractedHashes.maxOfOrNull { frameHash ->
                    ImageHasher.calculateSimilarity(ref.hash, frameHash)
                } ?: 0.0
                MatchResult(movie = ref, similarityPercentage = bestScore)
            }.sortedByDescending { it.similarityPercentage }

            onProgress(1.0f, "Concluído!")
            results
        } finally {
            retriever.release()
        }
    }
}`);
