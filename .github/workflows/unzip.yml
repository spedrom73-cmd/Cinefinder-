name: Descompactar projeto
on:
  workflow_dispatch:
  push:
    paths: ["CineFinder.zip"]
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o CineFinder.zip -x ".github/*"
          rm CineFinder.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Projeto descompactado"
          git push
